<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAS Model Archiver Preview</title>
  <link rel="stylesheet" href="app/static/style.css">
</head>
<body>
  <div class="app-frame">
    <aside class="sidebar mobile-panel" data-mobile-panel="folders">
      <button type="button" class="brand-button" id="home-button">
        <span class="brand-title">Model Archiver</span>
        <span class="brand-subtitle">저장소로 모델 파일을 보관합니다</span>
      </button>

      <section class="folder-section" aria-label="저장 폴더">
        <div class="sidebar-heading">
          <h2>저장 폴더</h2>
          <span class="path-badge">/data</span>
        </div>
        <div class="folder-tree">
          <ul>
            <li class="folder-node has-children expanded">
              <div class="folder-row">
                <button type="button" class="folder-toggle" aria-label="폴더 접기 또는 열기"></button>
                <button type="button" class="folder-picker selected" data-path="" data-name="data">
                  <span class="folder-icon" aria-hidden="true"></span>
                  <span class="folder-name">data</span>
                </button>
              </div>
              <ul class="folder-children">
                <li class="folder-node has-children expanded">
                  <div class="folder-row">
                    <button type="button" class="folder-toggle" aria-label="폴더 접기 또는 열기"></button>
                    <button type="button" class="folder-picker" data-path="stable-diffusion" data-name="stable-diffusion">
                      <span class="folder-icon" aria-hidden="true"></span>
                      <span class="folder-name">stable-diffusion</span>
                    </button>
                  </div>
                  <ul class="folder-children">
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="stable-diffusion/checkpoints" data-name="checkpoints">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">checkpoints</span>
                        </button>
                      </div>
                    </li>
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="stable-diffusion/loras" data-name="loras">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">loras</span>
                        </button>
                      </div>
                    </li>
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="stable-diffusion/diffusion_models" data-name="diffusion_models">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">diffusion_models</span>
                        </button>
                      </div>
                    </li>
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="stable-diffusion/embeddings" data-name="embeddings">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">embeddings</span>
                        </button>
                      </div>
                    </li>
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="stable-diffusion/vae" data-name="vae">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">vae</span>
                        </button>
                      </div>
                    </li>
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="stable-diffusion/controlnet" data-name="controlnet">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">controlnet</span>
                        </button>
                      </div>
                    </li>
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="stable-diffusion/upscalers" data-name="upscalers">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">upscalers</span>
                        </button>
                      </div>
                    </li>
                  </ul>
                </li>
                <li class="folder-node has-children expanded">
                  <div class="folder-row">
                    <button type="button" class="folder-toggle" aria-label="폴더 접기 또는 열기"></button>
                    <button type="button" class="folder-picker" data-path="huggingface" data-name="huggingface">
                      <span class="folder-icon" aria-hidden="true"></span>
                      <span class="folder-name">huggingface</span>
                    </button>
                  </div>
                  <ul class="folder-children">
                    <li class="folder-node">
                      <div class="folder-row">
                        <span class="folder-toggle-spacer"></span>
                        <button type="button" class="folder-picker" data-path="huggingface/llm" data-name="llm">
                          <span class="folder-icon" aria-hidden="true"></span>
                          <span class="folder-name">llm</span>
                        </button>
                      </div>
                    </li>
                  </ul>
                </li>
                <li class="folder-node">
                  <div class="folder-row">
                    <span class="folder-toggle-spacer"></span>
                    <button type="button" class="folder-picker" data-path="civitai" data-name="civitai">
                      <span class="folder-icon" aria-hidden="true"></span>
                      <span class="folder-name">civitai</span>
                    </button>
                  </div>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </section>

      <form class="new-folder-form" onsubmit="event.preventDefault()">
        <label for="folder_path">새 폴더</label>
        <input id="folder_path" name="folder_path" placeholder="stable-diffusion/checkpoints">
        <button type="submit">폴더 생성</button>
      </form>

      <button type="button" class="account-button" id="token-button" aria-haspopup="dialog" aria-controls="token-modal">
        <span class="avatar">GB</span>
        <span class="account-copy">
          <strong>go blin</strong>
          <small>Pro</small>
        </span>
        <span class="account-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M9 7.5A2.5 2.5 0 0 1 11.5 5h1A2.5 2.5 0 0 1 15 7.5V9h1a3 3 0 0 1 3 3v3.5A3.5 3.5 0 0 1 15.5 19h-7A3.5 3.5 0 0 1 5 15.5V12a3 3 0 0 1 3-3h1V7.5Zm2 1.5h2V7.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5V9Zm-3 2a1 1 0 0 0-1 1v3.5A1.5 1.5 0 0 0 8.5 17h7a1.5 1.5 0 0 0 1.5-1.5V12a1 1 0 0 0-1-1H8Z"/>
          </svg>
        </span>
      </button>
    </aside>

    <main class="content">
      <button type="button" class="refresh-corner" title="새로고침" aria-label="새로고침">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M19.7 12.7a7.7 7.7 0 0 1-12.9 4.4l1.4-1.4a5.7 5.7 0 0 0 9.5-3.2h2Zm-15.4-1.4A7.7 7.7 0 0 1 17.2 6.9l-1.4 1.4a5.7 5.7 0 0 0-9.5 3.2h-2Z"/>
          <path d="M18.3 3.7V8h-4.3l4.3-4.3ZM5.7 20.3V16H10l-4.3 4.3Z"/>
        </svg>
      </button>

      <section class="hero mobile-panel is-mobile-panel-active" data-mobile-panel="download" aria-label="다운로드 입력">
        <h1>civitai - Hugging Face</h1>
        <form class="download-form" id="command-form" onsubmit="event.preventDefault()">
          <input id="target_subdir" name="target_subdir" type="hidden">
          <label class="sr-only" for="input_text">URL 또는 CLI 입력</label>
          <div class="download-bar">
            <input id="input_text" name="input_text" class="download-input" placeholder="URL 또는 다운로드 명령 입력" autocomplete="off">
            <button type="submit" class="submit-orb" title="다운로드 시작" aria-label="다운로드 시작">
              <span></span><span></span><span></span>
            </button>
          </div>
          <div class="selected-folder-line">
            <span id="selected-folder">자동 분류</span>
          </div>
        </form>
      </section>

      <section class="view active mobile-panel" id="home-view" data-mobile-panel="jobs" aria-label="작업 목록">
        <section class="jobs-section">
          <h2>작업 목록</h2>
          <div class="table-shell">
            <table class="jobs-table">
              <thead>
                <tr>
                  <th class="col-id">ID</th>
                  <th class="col-status">상태</th>
                  <th class="col-info">정보</th>
                  <th class="col-source">소스</th>
                  <th class="col-input">입력</th>
                  <th class="col-file">파일</th>
                  <th class="col-progress">진행률</th>
                  <th class="col-log">로그</th>
                </tr>
              </thead>
              <tbody id="jobs-body"></tbody>
            </table>
          </div>
        </section>
      </section>

      <section class="view mobile-panel" id="library-view" data-mobile-panel="library" aria-label="라이브러리">
        <section class="library-section">
          <div class="library-meta">
            <span id="library-path">/data</span>
            <span id="library-count">0개</span>
          </div>
          <div class="library-grid" id="library-grid"></div>
        </section>
      </section>
    </main>
  </div>

  <nav class="mobile-tabbar" aria-label="모바일 탭">
    <button type="button" class="active" data-mobile-tab="download">입력</button>
    <button type="button" data-mobile-tab="jobs">작업</button>
    <button type="button" data-mobile-tab="library">보관함</button>
    <button type="button" data-mobile-tab="folders">폴더</button>
    <button type="button" data-mobile-action="settings">설정</button>
  </nav>

  <section class="token-modal" id="token-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="settings-panel">
      <nav class="settings-nav" aria-label="설정 메뉴">
        <button type="button" class="settings-close" id="settings-close" aria-label="설정 닫기">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Z"/>
            <path d="M17.6 5 19 6.4 6.4 19 5 17.6 17.6 5Z"/>
          </svg>
        </button>
        <a class="settings-nav-item active" href="#settings-general">
          <span aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.3 7.3 0 0 0-2.6-1.5L14 2.5h-4L9.6 5a7.3 7.3 0 0 0-2.6 1.5l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.3 7.3 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5A7.3 7.3 0 0 0 17 17.5l2.4 1 2-3.5-2-1.5ZM12 15.2A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4Z"/>
            </svg>
          </span>
          일반
        </a>
        <a class="settings-nav-item" href="#settings-tokens">
          <span aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7.5 14a5.5 5.5 0 1 1 5-3.2l6.7 6.7V20H17v-2.2h-2.2v-2.2h-2.3A5.4 5.4 0 0 1 7.5 14Zm0-2a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
            </svg>
          </span>
          API 토큰
        </a>
        <a class="settings-nav-item" href="#settings-folders">
          <span aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2H18a3 3 0 0 1 3 3v8.5A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Zm2 1V17.5c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V9a1 1 0 0 0-1-1h-7.3l-2-2H5.5c-.3 0-.5.2-.5.5Z"/>
            </svg>
          </span>
          폴더
        </a>
      </nav>

      <form class="settings-form" onsubmit="event.preventDefault()">
        <header class="settings-header" id="settings-general">
          <div>
            <h2 id="settings-title">설정</h2>
            <p>다운로드 토큰과 자동 분류 폴더를 한곳에서 관리합니다.</p>
          </div>
          <button type="submit" class="settings-save top-save">저장</button>
        </header>

        <section class="settings-block" id="settings-tokens">
          <div class="settings-block-copy">
            <h3>API 토큰</h3>
            <p>비워 두면 기존에 저장된 토큰을 유지합니다.</p>
          </div>
          <div class="settings-grid two-cols">
            <label class="setting-field" for="hf_token">
              <span>Hugging Face Token</span>
              <input id="hf_token" name="hf_token" type="password" placeholder="설정됨 · ui">
            </label>
            <label class="setting-field" for="civitai_token">
              <span>Civitai Token</span>
              <input id="civitai_token" name="civitai_token" type="password" placeholder="설정됨 · ui">
            </label>
          </div>
        </section>

        <section class="settings-block" id="settings-folders">
          <div class="settings-block-copy">
            <h3>폴더 설정</h3>
            <p>모든 경로는 /data 기준입니다. 다운로드 정보에 따라 기본 저장 위치로 사용됩니다.</p>
          </div>

          <label class="setting-field compact" for="library_active">
            <span>활성 라이브러리</span>
            <select id="library_active" name="library_active">
              <option value="ComfyUI" selected>ComfyUI</option>
              <option value="Custom">Custom</option>
            </select>
          </label>

          <div class="settings-grid">
            <label class="setting-field" for="route_llm_root">
              <span>기본 LLM 루트</span>
              <input id="route_llm_root" name="route_llm_root" value="huggingface/llm" placeholder="huggingface/llm">
              <small>Hugging Face LLM, GGUF 계열의 기본 위치입니다.</small>
            </label>
            <label class="setting-field" for="route_lora_root">
              <span>기본 LoRA 루트</span>
              <input id="route_lora_root" name="route_lora_root" value="stable-diffusion/loras" placeholder="stable-diffusion/loras">
              <small>LoRA, LoCon 다운로드의 기본 위치입니다.</small>
            </label>
            <label class="setting-field" for="route_checkpoint_root">
              <span>기본 Checkpoint 루트</span>
              <input id="route_checkpoint_root" name="route_checkpoint_root" value="stable-diffusion/checkpoints" placeholder="stable-diffusion/checkpoints">
              <small>Civitai Checkpoint와 Hugging Face 이미지 모델의 기본 위치입니다.</small>
            </label>
            <label class="setting-field" for="route_diffusion_model_root">
              <span>기본 Diffusion Model 루트</span>
              <input id="route_diffusion_model_root" name="route_diffusion_model_root" value="stable-diffusion/diffusion_models" placeholder="stable-diffusion/diffusion_models">
              <small>UNET, Diffusion Model 파일의 기본 위치입니다.</small>
            </label>
            <label class="setting-field" for="route_embedding_root">
              <span>기본 Embedding 루트</span>
              <input id="route_embedding_root" name="route_embedding_root" value="stable-diffusion/embeddings" placeholder="stable-diffusion/embeddings">
              <small>Textual Inversion, 임베딩 모델의 기본 위치입니다.</small>
            </label>
            <label class="setting-field" for="route_vae_root">
              <span>기본 VAE 루트</span>
              <input id="route_vae_root" name="route_vae_root" value="stable-diffusion/vae" placeholder="stable-diffusion/vae">
            </label>
            <label class="setting-field" for="route_controlnet_root">
              <span>기본 ControlNet 루트</span>
              <input id="route_controlnet_root" name="route_controlnet_root" value="stable-diffusion/controlnet" placeholder="stable-diffusion/controlnet">
            </label>
            <label class="setting-field" for="route_upscaler_root">
              <span>기본 Upscaler 루트</span>
              <input id="route_upscaler_root" name="route_upscaler_root" value="stable-diffusion/upscalers" placeholder="stable-diffusion/upscalers">
            </label>
          </div>
        </section>

        <footer class="settings-footer">
          <button type="button" class="settings-cancel" id="settings-cancel">취소</button>
          <button type="submit" class="settings-save">저장</button>
        </footer>
      </form>
    </div>
  </section>

  <div class="context-menu" id="context-menu" role="menu" hidden>
    <div class="context-menu-title" id="context-menu-title">/data</div>
    <button type="button" data-action="download" role="menuitem">다운로드</button>
    <button type="button" data-action="rename" role="menuitem">이름 변경</button>
    <button type="button" data-action="move" role="menuitem">이동</button>
    <button type="button" data-action="delete" role="menuitem" class="danger">삭제</button>
  </div>

  <section class="download-queue" id="download-queue" aria-live="polite" hidden>
    <div class="download-queue-head">
      <strong>다운로드 대기열</strong>
      <button type="button" id="download-queue-close" aria-label="다운로드 대기열 닫기">×</button>
    </div>
    <div class="download-queue-list" id="download-queue-list"></div>
  </section>

  <script>
    const sampleThumb = 'https://image.civitai.com/xG1nkqKTMzGDvpLrqFT7WA/b50708a9-a0a2-4a62-a688-cbd15abb65e4/width=450/8301359.jpeg';
    const currentJobs = [
      {
        id: 3,
        status: 'running',
        source: 'civitai',
        input_text: 'https://civitai.com/models/123456/name?modelVersionId=456789',
        filename: 'model.safetensors',
        progress_human: '2.8 GB',
        total_human: '4.4 GB',
        percent: 64,
        model_title: 'Animagine XL V3.1',
        model_category: 'Image Checkpoint',
        base_model: 'SDXL 1.0',
        precision: 'fp16',
        file_format: 'SafeTensor',
        thumbnail_url: sampleThumb,
        target_dir: '/data/stable-diffusion/checkpoints'
      },
      {
        id: 2,
        status: 'done',
        source: 'huggingface',
        input_text: 'hf download openai-community/gpt2 --include *.json',
        filename: 'snapshot',
        progress_human: '548.0 MB',
        total_human: '548.0 MB',
        percent: 100,
        model_title: 'openai-community/gpt2',
        model_category: 'LLM',
        base_model: 'gpt2',
        precision: 'F32',
        file_format: 'SafeTensor',
        thumbnail_url: '',
        target_dir: '/data/huggingface/llm/openai-community/gpt2'
      },
      {
        id: 1,
        status: 'failed',
        source: 'generic',
        input_text: 'https://example.com/model.bin',
        filename: '-',
        progress_human: '0.0 B',
        total_human: '',
        percent: null,
        model_title: 'https://example.com/model.bin',
        model_category: 'Generic URL',
        base_model: '',
        precision: '',
        file_format: '',
        thumbnail_url: '',
        target_dir: '/data'
      }
    ];

    for (let i = 0; i < 14; i += 1) {
      currentJobs.push({
        id: 10 + i,
        status: 'done',
        source: 'civitai',
        input_text: 'https://civitai.com/models/example',
        filename: `lora-${i + 1}.safetensors`,
        progress_human: '144.0 MB',
        total_human: '144.0 MB',
        percent: 100,
        model_title: 'Add Micro Details - Concept',
        model_category: 'LoRA',
        base_model: 'Pony',
        precision: 'fp16',
        file_format: 'SafeTensor',
        thumbnail_url: sampleThumb,
        target_dir: i % 2 === 0 ? '/data/stable-diffusion/loras' : '/data/civitai'
      });
    }

    const targetInput = document.getElementById('target_subdir');
    const selectedFolder = document.getElementById('selected-folder');
    const homeView = document.getElementById('home-view');
    const libraryView = document.getElementById('library-view');
    const libraryGrid = document.getElementById('library-grid');
    const libraryPath = document.getElementById('library-path');
    const libraryCount = document.getElementById('library-count');
    const tokenButton = document.getElementById('token-button');
    const tokenModal = document.getElementById('token-modal');
    const settingsClose = document.getElementById('settings-close');
    const settingsCancel = document.getElementById('settings-cancel');
    const mobileTabs = document.querySelectorAll('[data-mobile-tab]');
    const mobilePanels = document.querySelectorAll('[data-mobile-panel]');
    const mobileSettingsButton = document.querySelector('[data-mobile-action="settings"]');
    const commandInput = document.getElementById('input_text');
    const contextMenu = document.getElementById('context-menu');
    const contextMenuTitle = document.getElementById('context-menu-title');
    const downloadQueuePanel = document.getElementById('download-queue');
    const downloadQueueList = document.getElementById('download-queue-list');
    const downloadQueueClose = document.getElementById('download-queue-close');
    let contextTarget = null;
    let downloadQueue = [];
    let downloadQueueId = 1;
    let activeLibraryPath = null;
    let activeMobileTab = 'download';

    document.getElementById('home-button').addEventListener('click', switchToHome);

    document.querySelectorAll('.folder-picker').forEach(button => {
      button.addEventListener('click', () => {
        const path = button.dataset.path || '';
        targetInput.value = path;
        selectedFolder.textContent = path ? `/data/${path}` : '/data';
        document.querySelectorAll('.folder-picker').forEach(item => item.classList.remove('selected'));
        button.classList.add('selected');
        switchToLibrary(path);
      });
      button.addEventListener('contextmenu', event => {
        event.preventDefault();
        event.stopPropagation();
        showContextMenu(event.clientX, event.clientY, {
          path: button.dataset.path || '',
          name: button.dataset.name || 'data',
        });
      });
    });

    document.querySelectorAll('.folder-toggle').forEach(button => {
      button.addEventListener('click', event => {
        event.stopPropagation();
        button.closest('.folder-node').classList.toggle('expanded');
      });
    });

    tokenButton.addEventListener('click', event => {
      event.stopPropagation();
      openSettingsModal();
    });

    tokenModal.addEventListener('click', event => {
      if (event.target === tokenModal) {
        closeSettingsModal();
      }
      event.stopPropagation();
    });
    settingsClose.addEventListener('click', closeSettingsModal);
    settingsCancel.addEventListener('click', closeSettingsModal);
    mobileTabs.forEach(button => {
      button.addEventListener('click', () => {
        activateMobileTab(button.dataset.mobileTab || 'download');
      });
    });
    mobileSettingsButton.addEventListener('click', event => {
      event.stopPropagation();
      openSettingsModal();
    });

    document.addEventListener('click', () => {
      closeSettingsModal();
      hideContextMenu();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeSettingsModal();
        hideContextMenu();
      }
    });

    libraryGrid.addEventListener('contextmenu', event => {
      const card = event.target.closest('.asset-card');
      if (!card) return;
      event.preventDefault();
      event.stopPropagation();
      showContextMenu(event.clientX, event.clientY, {
        path: card.dataset.path || '',
        name: card.dataset.name || card.dataset.path || 'model',
      });
    });

    contextMenu.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button || button.disabled) return;
      handleContextAction(button.dataset.action);
    });
    downloadQueueClose.addEventListener('click', () => {
      downloadQueuePanel.hidden = true;
    });

    function switchToHome() {
      activeLibraryPath = null;
      targetInput.value = '';
      commandInput.value = '';
      commandInput.placeholder = 'URL 또는 다운로드 명령 입력';
      commandInput.setAttribute('aria-label', 'URL 또는 CLI 입력');
      selectedFolder.textContent = '자동 분류';
      document.querySelectorAll('.folder-picker').forEach(item => item.classList.remove('selected'));
      homeView.classList.add('active');
      libraryView.classList.remove('active');
      activateMobileTab('download');
    }

    function openSettingsModal() {
      tokenModal.hidden = false;
      document.body.classList.add('modal-open');
      settingsClose.focus();
    }

    function closeSettingsModal() {
      if (tokenModal.hidden) return;
      tokenModal.hidden = true;
      document.body.classList.remove('modal-open');
    }

    function switchToLibrary(path) {
      activeLibraryPath = path || '';
      commandInput.value = '';
      commandInput.placeholder = '이 폴더에 받을 URL 또는 다운로드 명령 입력';
      commandInput.setAttribute('aria-label', 'URL 또는 CLI 입력');
      homeView.classList.remove('active');
      libraryView.classList.add('active');
      renderLibrary();
      if (isMobileLayout()) {
        activateMobileTab('library');
      }
    }

    function activateMobileTab(tab) {
      activeMobileTab = tab;
      if (tab === 'library' && activeLibraryPath === null) {
        activeLibraryPath = '';
        renderLibrary();
      }
      mobileTabs.forEach(button => {
        button.classList.toggle('active', button.dataset.mobileTab === tab);
      });
      mobilePanels.forEach(panel => {
        panel.classList.toggle('is-mobile-panel-active', panel.dataset.mobilePanel === tab);
      });
    }

    function isMobileLayout() {
      return window.matchMedia('(max-width: 700px)').matches;
    }

    function renderJobs(jobs) {
      const body = document.getElementById('jobs-body');
      body.innerHTML = jobs.slice(0, 5).map(job => {
        const pct = job.percent !== null && job.percent !== undefined ? Number(job.percent) : null;
        const progress = pct !== null && Number.isFinite(pct)
          ? `<div class="progress"><div style="width:${pct}%"></div></div>${pct}% · ${escapeHtml(job.progress_human)} / ${escapeHtml(job.total_human)}`
          : escapeHtml(job.progress_human || '');
        return `<tr>
          <td data-label="ID">${job.id}</td>
          <td data-label="상태"><span class="status ${escapeHtml(job.status)}">${escapeHtml(job.status)}</span></td>
          <td data-label="정보">${renderModelInfo(job)}</td>
          <td data-label="소스">${escapeHtml(job.source || '-')}</td>
          <td data-label="입력" class="input-cell">${escapeHtml(job.input_text || '')}</td>
          <td data-label="파일">${escapeHtml(job.filename || '-')}</td>
          <td data-label="진행률">${progress}</td>
          <td data-label="로그"><a href="#">보기</a></td>
        </tr>`;
      }).join('');
    }

    function renderModelInfo(job) {
      const image = job.thumbnail_url ? `<img src="${escapeHtml(job.thumbnail_url)}" alt="">` : '';
      const details = [job.base_model, job.precision, job.file_format].filter(Boolean).map(escapeHtml).join(' · ');
      return `<div class="model-card ${job.thumbnail_url ? '' : 'no-thumb'}">
        ${image}
        <div>
          <strong>${escapeHtml(job.model_title || job.filename || job.input_text || '-')}</strong>
          <span>${escapeHtml(job.model_category || job.source || '-')}</span>
          <small>${details}</small>
        </div>
      </div>`;
    }

    function renderLibrary() {
      const folder = activeLibraryPath || '';
      const matches = currentJobs.filter(job => jobMatchesFolder(job, folder));
      libraryPath.textContent = folder ? `/data/${folder}` : '/data';
      libraryCount.textContent = `${matches.length}개`;
      if (!matches.length) {
        libraryGrid.innerHTML = '<div class="library-empty">이 폴더에 표시할 모델 카드가 없습니다.</div>';
        return;
      }
      libraryGrid.innerHTML = matches.map(job => {
        const title = job.model_title || job.filename || job.input_text || 'Model';
        const category = job.model_category || job.source || 'Model';
        const meta = [job.base_model, job.precision, job.file_format].filter(Boolean).join(' · ');
        const image = job.thumbnail_url
          ? `<img src="${escapeHtml(job.thumbnail_url)}" alt="">`
          : `<div class="asset-placeholder">${escapeHtml((category || 'AI').slice(0, 2).toUpperCase())}</div>`;
        const targetPath = normalizePath(job.target_dir || '');
        return `<article class="asset-card" data-path="${escapeHtml(targetPath)}" data-name="${escapeHtml(title)}">
          ${image}
          <div class="asset-topline">
            <span>${escapeHtml(shortSource(job.source))}</span>
            <span class="asset-dots" aria-hidden="true"></span>
          </div>
          <div class="asset-overlay">
            <strong>${escapeHtml(title)}</strong>
            <span>${escapeHtml(category)}</span>
            <small>${escapeHtml(meta)}</small>
          </div>
        </article>`;
      }).join('');
    }

    function jobMatchesFolder(job, folder) {
      if (!folder) return true;
      const target = normalizePath(job.target_dir || '');
      return target === folder || target.startsWith(`${folder}/`);
    }

    function normalizePath(value) {
      return String(value)
        .replace(/\\/g, '/')
        .replace(/^\/data\/?/, '')
        .replace(/^data\/?/, '')
        .replace(/^\/+|\/+$/g, '');
    }

    function showContextMenu(x, y, target) {
      contextTarget = target;
      const label = target.path ? `/data/${target.path}` : '/data';
      contextMenuTitle.textContent = label;
      contextMenu.hidden = false;
      const disabled = !target.path;
      contextMenu.querySelectorAll('button[data-action]').forEach(button => {
        button.disabled = disabled;
      });
      const rect = contextMenu.getBoundingClientRect();
      const left = Math.min(x, window.innerWidth - rect.width - 8);
      const top = Math.min(y, window.innerHeight - rect.height - 8);
      contextMenu.style.left = `${Math.max(8, left)}px`;
      contextMenu.style.top = `${Math.max(8, top)}px`;
    }

    function hideContextMenu() {
      contextMenu.hidden = true;
      contextTarget = null;
    }

    function handleContextAction(action) {
      if (!contextTarget || !contextTarget.path) return;
      if (action === 'download') {
        enqueueLocalDownload(contextTarget);
        hideContextMenu();
        return;
      }
      const label = `/data/${contextTarget.path}`;
      hideContextMenu();
      window.alert(`${label}\n\n실제 앱에서는 ${actionLabel(action)} 작업을 실행합니다.`);
    }

    function enqueueLocalDownload(target) {
      downloadQueue.push({
        id: downloadQueueId++,
        label: target.path ? `/data/${target.path}` : target.name,
        status: 'started',
        message: '브라우저 다운로드 시작',
      });
      renderDownloadQueue();
      setTimeout(() => {
        const item = downloadQueue[downloadQueue.length - 1];
        if (item) {
          item.status = 'done';
          item.message = '요청 완료';
          renderDownloadQueue();
        }
      }, 1200);
    }

    function renderDownloadQueue() {
      downloadQueuePanel.hidden = false;
      downloadQueueList.innerHTML = downloadQueue.map(item => `
        <div class="download-queue-item ${escapeHtml(item.status)}">
          <span>${escapeHtml(item.label)}</span>
          <small>${escapeHtml(item.message)}</small>
        </div>
      `).join('');
    }

    function actionLabel(action) {
      if (action === 'download') return '다운로드';
      if (action === 'rename') return '이름 변경';
      if (action === 'move') return '이동';
      if (action === 'delete') return '삭제';
      return '파일';
    }

    function shortSource(source) {
      if (source === 'huggingface') return 'HF';
      if (source === 'civitai') return 'NAI';
      return 'URL';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    renderJobs(currentJobs);
  </script>
</body>
</html>
