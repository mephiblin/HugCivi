# Portainer Stack for Synology NAS
#
# Recommended mode:
#   Portainer > Stacks > Add stack > Repository
#   Compose path: portainer-stack.yml
#   Set APP_PASSWORD in the stack environment variables before deploying.

services:
  nas-model-archiver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      TZ: "Asia/Seoul"
      APP_USERNAME: "${APP_USERNAME:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:-replace-with-a-strong-password}"

      # Tokens can also be saved later in the web UI.
      HF_TOKEN: "${HF_TOKEN:-}"
      CIVITAI_TOKEN: "${CIVITAI_TOKEN:-}"

      # Default library routing. Paths are relative to /data.
      LIBRARY_ACTIVE: "ComfyUI"
      ROUTE_LLM_ROOT: "huggingface/llm"
      ROUTE_LORA_ROOT: "stable-diffusion/loras"
      ROUTE_CHECKPOINT_ROOT: "stable-diffusion/checkpoints"
      ROUTE_DIFFUSION_MODEL_ROOT: "stable-diffusion/diffusion_models"
      ROUTE_EMBEDDING_ROOT: "stable-diffusion/embeddings"
      ROUTE_VAE_ROOT: "stable-diffusion/vae"
      ROUTE_CONTROLNET_ROOT: "stable-diffusion/controlnet"
      ROUTE_UPSCALER_ROOT: "stable-diffusion/upscalers"
      HITOMI_BACKEND: "${HITOMI_BACKEND:-auto}"
      GALLERY_DL_AUTO_UPDATE: "${GALLERY_DL_AUTO_UPDATE:-1}"
      GALLERY_DL_UPDATE_SPEC: "${GALLERY_DL_UPDATE_SPEC:-gallery-dl<2.0}"
      GALLERY_DL_SLEEP_REQUEST_SECONDS: "${GALLERY_DL_SLEEP_REQUEST_SECONDS:-1.5}"
      GALLERY_DL_USERNAME: "${GALLERY_DL_USERNAME:-}"
      GALLERY_DL_PASSWORD: "${GALLERY_DL_PASSWORD:-}"
      GALLERY_DL_COOKIES_FILE: "${GALLERY_DL_COOKIES_FILE:-}"
      GALLERY_DL_COOKIES_FROM_BROWSER: "${GALLERY_DL_COOKIES_FROM_BROWSER:-}"
      GALLERY_DL_EXTRA_OPTIONS: "${GALLERY_DL_EXTRA_OPTIONS:-}"

      # Conservative download defaults to reduce rate-limit risk.
      MAX_CONCURRENT_DOWNLOADS: "${MAX_CONCURRENT_DOWNLOADS:-3}"
      QUEUE_PER_PROVIDER_LIMIT: "${QUEUE_PER_PROVIDER_LIMIT:-1}"
      DOWNLOAD_STALL_TIMEOUT_SECONDS: "${DOWNLOAD_STALL_TIMEOUT_SECONDS:-0}"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_XET_HIGH_PERFORMANCE: "0"
      HF_XET_NUM_CONCURRENT_RANGE_GETS: "4"
      HF_XET_RECONSTRUCT_WRITE_SEQUENTIALLY: "1"
      HF_SNAPSHOT_MAX_WORKERS: "2"
      DOWNLOAD_REQUEST_MIN_INTERVAL_SECONDS: "1.5"
      DOWNLOAD_HTTP_MAX_RETRIES: "3"
      DOWNLOAD_RETRY_BACKOFF_SECONDS: "5"
      DOWNLOAD_MAX_RETRY_SLEEP_SECONDS: "300"
      DOWNLOAD_ENABLE_HEAD_REQUESTS: "1"
    volumes:
      - type: bind
        source: /volume1/docker/nas-model-archiver/models
        target: /data
      - type: bind
        source: /volume1/docker/nas-model-archiver/config
        target: /config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${APP_USERNAME}:$${APP_PASSWORD}\" http://127.0.0.1:8088/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
